name: Release DMG

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/RELEASE_VERSION"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(tr -d '[:space:]' < .github/RELEASE_VERSION)"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Run backend tests
        run: python3 -m unittest discover -s tests -v

      - name: Build app
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./build_app.sh

      - name: Package ZIP and DMG
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          APP="build/VEN OBS Utils.app"
          DIST="build/dist"
          DMG_ROOT="$DIST/dmg-root"

          rm -rf "$DIST"
          mkdir -p "$DMG_ROOT"

          ditto "$APP" "$DMG_ROOT/VEN OBS Utils.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$DIST/VEN-OBS-Utils-${TAG}.zip"

          hdiutil create \
            -volname "VEN OBS Utils" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DIST/VEN-OBS-Utils-${TAG}.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          DMG="build/dist/VEN-OBS-Utils-${TAG}.dmg"
          ZIP="build/dist/VEN-OBS-Utils-${TAG}.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$ZIP" --clobber
          else
            gh release create "$TAG" \
              "$DMG" \
              "$ZIP" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "VEN OBS Utils ${TAG}"
          fi
