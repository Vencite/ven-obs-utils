name: Release DMG

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/RELEASE_VERSION"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(tr -d '[:space:]' < .github/RELEASE_VERSION)"
          fi

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            [[ "$GITHUB_REF_TYPE" == "tag" ]] || exit 1
            PRERELEASE=true
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          else
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Require green develop CI for RC
        if: steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT="$(gh run list --workflow test.yml --branch develop --commit "$GITHUB_SHA" --status success --json headSha --jq 'length')"
          [[ "$COUNT" -gt 0 ]]

      - name: Run all Python and Swift tests
        timeout-minutes: 15
        run: ./test.sh

      - name: Build app
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        run: ./build_app.sh

      - name: Package and verify ZIP and DMG
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: ./package_app.sh "$TAG"

      - name: Upload verified installers before publication
        uses: actions/upload-artifact@v4
        with:
          name: VEN-OBS-Utils-installers-${{ github.sha }}
          path: |
            build/dist/*.zip
            build/dist/*.dmg
            build/dist/BUILD-INFO.json
            build/dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          fi
          FLAGS=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            FLAGS+=(--verify-tag)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            cp .github/RC-NOTES.md build/rc-notes.md
            printf '\nTested commit: `%s`\n' "$GITHUB_SHA" >> build/rc-notes.md
            FLAGS+=(--prerelease --latest=false --notes-file build/rc-notes.md)
          else
            FLAGS+=(--generate-notes)
          fi
          gh release create "$TAG" \
            "build/dist/VEN-OBS-Utils-${TAG}.dmg" \
            "build/dist/VEN-OBS-Utils-${TAG}.zip" \
            build/dist/BUILD-INFO.json build/dist/SHA256SUMS \
            "${FLAGS[@]}" --title "VEN OBS Utils ${VERSION}"
