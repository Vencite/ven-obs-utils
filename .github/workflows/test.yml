name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all Python and Swift tests
        timeout-minutes: 15
        run: ./test.sh
      - name: Upload settings previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VOS-settings-previews-${{ github.sha }}
          path: /tmp/vos-ui-screenshots/*.png
          if-no-files-found: ignore
      - name: Build macOS app
        env:
          DEVELOP_SHA: ${{ github.ref == 'refs/heads/develop' && github.sha || '' }}
        run: ./build_app.sh
      - name: Package develop test build
        if: github.ref == 'refs/heads/develop'
        run: ./package_app.sh develop
      - name: Upload develop test build
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: VEN-OBS-Utils-develop-${{ github.sha }}
          path: |
            build/dist/*.zip
            build/dist/*.dmg
            build/dist/BUILD-INFO.json
            build/dist/SHA256SUMS
          if-no-files-found: error
