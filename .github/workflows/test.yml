name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Swift scene automation tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/SceneAutomation.swift \
            app/Sources/AppConfig.swift \
            app/Tests/SceneAutomationTests.swift \
            -o /tmp/scene-automation-tests
          /tmp/scene-automation-tests
      - name: Run config migration tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/SceneAutomation.swift \
            app/Sources/AppConfig.swift \
            app/Tests/AppConfigMigrationTests.swift \
            -o /tmp/app-config-migration-tests
          /tmp/app-config-migration-tests
      - name: Run Keychain storage tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            -framework Security \
            app/Sources/KeychainStore.swift \
            app/Tests/KeychainStoreTests.swift \
            -o /tmp/keychain-store-tests
          /tmp/keychain-store-tests
      - name: Run OBS protocol tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            -framework CryptoKit \
            app/Sources/OBSProtocol.swift \
            app/Tests/OBSProtocolTests.swift \
            -o /tmp/obs-protocol-tests
          /tmp/obs-protocol-tests
      - name: Run OBS connection state tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            -framework CryptoKit \
            app/Sources/SceneAutomation.swift \
            app/Sources/OBSProtocol.swift \
            app/Sources/OBSConnectionState.swift \
            app/Tests/OBSConnectionStateTests.swift \
            -o /tmp/obs-connection-state-tests
          /tmp/obs-connection-state-tests
      - name: Run OBS websocket routing tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            -framework CryptoKit \
            app/Sources/SceneAutomation.swift \
            app/Sources/OBSProtocol.swift \
            app/Sources/OBSConnectionState.swift \
            app/Sources/OBSWebSocketClient.swift \
            app/Tests/OBSWebSocketClientTests.swift \
            -o /tmp/obs-websocket-client-tests
          /tmp/obs-websocket-client-tests
      - name: Run automation request ordering tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/SceneAutomation.swift \
            app/Sources/AutomationRequestSequence.swift \
            app/Tests/AutomationRequestSequenceTests.swift \
            -o /tmp/automation-request-sequence-tests
          /tmp/automation-request-sequence-tests
      - name: Run settings form tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/SceneAutomation.swift \
            app/Sources/AppConfig.swift \
            app/Sources/SettingsDraft.swift \
            app/Tests/SettingsDraftTests.swift \
            -o /tmp/settings-draft-tests
          /tmp/settings-draft-tests
      - name: Run service restart policy tests
        run: |
          xcrun --sdk macosx swiftc \
            app/Sources/ServiceRestartPolicy.swift \
            app/Tests/ServiceRestartPolicyTests.swift \
            -o /tmp/service-restart-policy-tests
          /tmp/service-restart-policy-tests
      - name: Run service restart lifecycle test
        timeout-minutes: 2
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/ServiceController.swift \
            app/Sources/StaleHelperCleanup.swift \
            app/Sources/ServiceRestartPolicy.swift \
            app/Tests/ServiceControllerTests.swift \
            -o /tmp/service-controller-tests
          /tmp/service-controller-tests
      - name: Run stale helper cleanup tests
        run: |
          xcrun --sdk macosx swiftc \
            app/Sources/StaleHelperCleanup.swift \
            app/Tests/StaleHelperCleanupTests.swift \
            -o /tmp/stale-helper-cleanup-tests
          /tmp/stale-helper-cleanup-tests
      - name: Run status presentation tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/StatusPresentation.swift \
            app/Tests/StatusPresentationTests.swift \
            -o /tmp/status-presentation-tests
          /tmp/status-presentation-tests
      - name: Run MPS state and selection tests
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/MPSState.swift \
            app/Tests/MPSStateTests.swift \
            -o /tmp/mps-state-tests
          /tmp/mps-state-tests
      - name: Run media heartbeat and reconnect regressions
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            app/Sources/MPSState.swift app/Sources/MediaBridgeController.swift \
            app/Tests/MediaBridgeControllerTests.swift -o /tmp/media-bridge-controller-tests
          /tmp/media-bridge-controller-tests
      - name: Verify settings visibility and capture previews
        run: |
          xcrun --sdk macosx swiftc -parse-as-library -framework AppKit \
            app/Sources/SceneAutomation.swift app/Sources/AppConfig.swift \
            app/Sources/SettingsDraft.swift app/Sources/SettingsWindowController.swift \
            app/Tests/SettingsWindowLayoutTests.swift -o /tmp/settings-layout-tests
          /tmp/settings-layout-tests
      - name: Upload settings previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VOS-settings-previews-${{ github.sha }}
          path: /tmp/vos-ui-screenshots/*.png
          if-no-files-found: ignore
      - name: Build macOS app
        run: ./build_app.sh
      - name: Package develop test build
        if: github.ref == 'refs/heads/develop'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/VEN OBS Utils.app" \
            "build/VEN-OBS-Utils-develop.zip"
      - name: Upload develop test build
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: VEN-OBS-Utils-develop-${{ github.sha }}
          path: build/VEN-OBS-Utils-develop.zip
          if-no-files-found: error
